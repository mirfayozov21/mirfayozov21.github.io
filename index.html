<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f3f5);
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8f98);
  --btn:var(--tg-theme-button-color,#2a8bf2);
  --btnText:var(--tg-theme-button-text-color,#fff);

}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg2);color:var(--text);padding:12px 12px calc(84px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.card{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{color:var(--hint);font-size:13px}
.big{font-size:28px;font-weight:700;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--bg2);border-radius:10px;padding:9px 10px;min-width:0}
.mini small{color:var(--hint);font-size:12px;display:block}
.mini b{display:block;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
h3{font-size:14px;color:var(--hint);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bg2);font-size:15px;gap:8px}
.line:last-child{border-bottom:none}
.line b{white-space:nowrap}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month button{background:var(--bg);border:none;color:var(--text);width:40px;height:36px;border-radius:10px;font-size:18px}
.month span{font-weight:600}
.addbtn{width:100%;background:var(--btn);color:var(--btnText);border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;margin-bottom:12px}
.row2{display:flex;gap:8px}
.row2 .addbtn{flex:1}
.ghost{background:var(--bg);color:var(--btn)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg2)}
.item:last-child{border-bottom:none}
.ico{width:38px;height:38px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.mid{flex:1;min-width:0}
.mid div{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--hint);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bdg{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--bg2);color:var(--hint);margin-top:3px}
.bdg.bad{background:rgba(229,72,77,.14);color:var(--red)}
.bdg.warn{background:rgba(224,138,0,.15);color:var(--orange)}
.bdg.ok{background:rgba(31,164,99,.14);color:var(--green)}
.empty{text-align:center;color:var(--hint);padding:20px 0;font-size:14px}
.bar{margin-bottom:10px}
.bar .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.track{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--red)}
.filters{display:flex;gap:6px;margin-bottom:12px}
.filters button{border:none;background:var(--bg);color:var(--text);padding:8px 14px;border-radius:20px;font-size:14px}
.filters button.on{background:var(--btn);color:var(--btnText)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);display:flex;border-top:1px solid var(--bg2);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;border:none;background:none;color:var(--hint);padding:8px 0 9px;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--btn)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:10}
.sheet-bg.show{display:flex}

.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600}
.save{background:var(--btn);color:var(--btnText)}
.cancel{background:var(--bg2);color:var(--text)}
.del{background:none;color:var(--red);border:none;width:100%;padding:12px;margin-top:6px;font-size:15px}
.x{background:none;border:none;color:var(--red);font-size:18px;padding:0 4px}
.box{background:var(--bg2);border-radius:12px;padding:10px 12px;margin-top:8px}
.box .line{border-bottom-color:var(--bg)}
.att{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bg2)}
.att:last-child{border-bottom:none}
.att .mid small{white-space:normal}
.att .tbtn{border:none;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;background:var(--btn);color:var(--btnText);white-space:nowrap}
.att .tbtn.out{background:var(--bg2);color:var(--text)}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.vchips button.on{background:var(--btn);color:var(--btnText)}
.vchips .newv{background:none;border:1px dashed var(--hint);color:var(--hint)}
.callbtn{display:inline-block;margin-top:6px;color:var(--btn);text-decoration:none;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 8px}
.thumbs:empty{display:none}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--bg2)}

label.photoBtn{display:block;text-align:center;padding:12px;border-radius:10px;border:2px dashed var(--hint);color:var(--btn);font-weight:600;font-size:15px;margin:4px 0 0}
#backBtn{position:fixed;top:10px;left:10px;z-index:30;display:none;align-items:center;border:none;border-radius:20px;padding:8px 14px;font-size:15px;font-weight:600;background:var(--bg);color:var(--btn);box-shadow:0 2px 10px rgba(0,0,0,.15)}
#viewer{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center}
#viewer.show{display:flex}

#viewer button{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px}

/* ===== Yangilangan dizayn ===== */
body{font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.card{border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h3{font-size:14px}
.big{font-size:30px;letter-spacing:-.02em}
.big span{font-size:16px;font-weight:600;opacity:.7}
.addbtn{border-radius:14px;padding:15px;box-shadow:0 4px 14px rgba(0,0,0,.08)}

.line.total{border-top:2px solid var(--bg2);border-bottom:none;margin-top:4px;font-weight:700}
.hero{background:linear-gradient(135deg,var(--btn),color-mix(in srgb,var(--btn) 70%,#000));color:var(--btnText)}
.hero .lbl{color:var(--btnText);opacity:.8}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.split>div{border-radius:12px;padding:10px 12px;background:var(--bg2);min-width:0}
.hero .split>div{background:rgba(255,255,255,.16)}
.split small{display:block;font-size:12px;opacity:.8}

.parts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:8px;opacity:.85}
.parts b{font-weight:600}
.shifts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.shift{border-radius:12px;padding:10px 12px;border:1px dashed rgba(255,255,255,.55);min-width:0}
.shift.done{border-style:solid;background:rgba(255,255,255,.12)}

label.step{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:600;font-size:14px;margin-top:14px}
.step i,.calc i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--btn);color:var(--btnText);font-size:12px;font-weight:700;flex-shrink:0}
input.num.total{font-size:24px;padding:14px;border:2px solid var(--btn)}
.calc{background:var(--bg2);border-radius:14px;padding:6px 14px 10px;margin-top:16px}
.calc .line{border-bottom:none;padding:8px 0 2px}
.calc .line span{display:flex;align-items:center;gap:8px}
.calc .sub{font-size:12px;color:var(--hint);padding-bottom:6px;border-bottom:1px solid var(--bg)}
.calc .sub:last-child{border-bottom:none}
.calc .cash b{font-size:22px;color:var(--green)}
.calc .cash.red b,.calc .sub.red{color:var(--red)}
.xrow{display:grid;grid-template-columns:1fr 1fr 32px;gap:6px;background:var(--bg2);border-radius:12px;padding:8px;margin-bottom:6px}
.xrow select,.xrow input{background:var(--bg);padding:10px;font-size:15px}
.xrow select{width:100%;border:none;border-radius:10px;color:var(--text)}

<body>

<script>
const tg = (window.Telegram && Telegram.WebApp) ? Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

/* ================= Qulf: faqat ruxsat berilgan Telegram akkauntlar ================= */
const OWNER_IDS = [1243874281]; // egasi; xodim qo'shish uchun ID ni shu ro'yxatga yozing
const ME = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
const ALLOWED = ME !== null && OWNER_IDS.includes(ME);
function showLock(){
  document.querySelector("nav").style.display = "none";
  document.body.style.paddingBottom = "12px";
  document.getElementById("page").innerHTML = `<div class="card" style="text-align:center;margin-top:30vh">
    <div style="font-size:44px">🔒</div>
    <div style="font-size:18px;font-weight:700;margin:8px 0">Ruxsat yo'q</div>
    <div class="lbl">Bu ilova shaxsiy va faqat egasi uchun.${ME?`<br><br>Sizning Telegram ID: <b>${ME}</b>`:"<br><br>Ilovani Telegram bot orqali oching."}</div>
  </div>`;
}

/* ================= Sozlamalar ================= */
/* Savdo qayerdan tushdi (kanallar). humo + uzcard + hisob raqam pullari bitta Umumiy bank hisobiga tushadi. */
const SALE = {naqd:"💵 Naqd", humo:"💳 Humo terminal", uzcard:"💳 Uzcard terminal", bank:"🏦 Hisob raqamga", karta:"💳 Karta"};
const SALES = Object.keys(SALE);
const BANKCH = ["humo","uzcard","bank"];
/* Pul turadigan hisoblar. Eski "humo"/"uzcard" hisoblari Umumiy bank hisobiga qo'shiladi. */
const ACC = {naqd:"💵 Naqd kassa", bank:"🏦 Umumiy bank hisobi", karta:"💳 Karta"};
const accOf = k => (k==="humo"||k==="uzcard") ? "bank" : (ACC[k] ? k : "naqd");
const accLabel = k => ACC[accOf(k)];
/* "Karta" hisobi faqat ilgari ishlatilgan bo'lsa ko'rsatiladi */
const kartaUsed = () => !!(D.start.karta || D.ops.some(o=>o.karta || o.acc==="karta" || o.to==="karta") || D.cust.some(c=>c.acc==="karta") || D.sups.some(s=>s.pays.some(p=>p.acc==="karta")));
const accs = () => kartaUsed() ? ["naqd","bank","karta"] : ["naqd","bank"];
const bankPart = o => sum(BANKCH, k=>o[k]||0);
const SMENA = {1:"1-kassa · 08:00–18:00", 2:"2-kassa · 18:00–23:00"};
const smenaShort = n => n ? `${n}-kassa` : "Kun bo'yi";
const nowSmena = () => new Date().getHours() < 18 ? "1" : "2";
const EXP_CATS = ["Ijara","Oylik","Kommunal","Transport","Soliq","Xo'jalik","Ovqat","Boshqa"];
const MONTHS = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];

/* Rasmlar saqlanadigan joy (Supabase) */
const SB_URL = "https://eormaktfhkaygogibtul.supabase.co";
const SB_KEY = "sb_publishable_ZjYSyCeCyJ4_5IB2qO7nCA_9K52egUG";
const BUCKET = "nakladnoy";
let SB = null;
try { SB = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false}}); } catch(e){}

let D = { ops:[], sups:[], cust:[], start:{}, vendors:[], staff:[], att:[], bonus:[], dayx:[] };
let tab = "home", cur = new Date(), supFilter = "open", F = {};
cur.setDate(1);

/* ================= Yordamchilar ================= */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const sm = n => (n<0?"−":"")+fmt(Math.abs(n));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let _u = 0; const uid = () => Date.now()*1000 + (_u++ % 1000);
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dnum = s => Math.round(Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10))/864e5);
const addDays = (s,n) => new Date(Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)+n)).toISOString().slice(0,10);
const MON3 = ["yan","fev","mar","apr","may","iyun","iyul","avg","sen","okt","noy","dek"];
const fd = s => s ? `${+s.slice(8,10)} ${MON3[+s.slice(5,7)-1]} ${s.slice(0,4)}` : "";
const monthKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const num = id => +(($(id)?.value||"").replace(/\D/g,"")) || 0;
const sum = (a,f) => a.reduce((s,x)=>s+f(x),0);
const haptic = t => { try { tg && tg.HapticFeedback.notificationOccurred(t); } catch(e){} };
const saleTotal = o => sum(SALES, k=>o[k]||0);

/* ---------- Rasmlar ---------- */
const photoUrl = p => p.startsWith("blob:") ? p : `${SB_URL}/storage/v1/object/public/${BUCKET}/${p}`;
async function compress(file){
  const src = URL.createObjectURL(file);
  try {
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
    const k = Math.min(1, 1600/Math.max(img.width,img.height));
    const c = document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.8));
  } finally { URL.revokeObjectURL(src); }
}
async function uploadPhoto(file){
  if (!SB) throw new Error("Internet yoki ulanishda muammo");
  const blob = await compress(file);
  const who = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || "web";
  const rnd = (crypto.randomUUID ? crypto.randomUUID() : String(uid())+Math.random().toString(36).slice(2));
  const path = `${who}/${today()}/${rnd}.jpg`;
  const { error } = await SB.storage.from(BUCKET).upload(path, blob, {contentType:"image/jpeg", upsert:false});
  if (error) throw error;
  return path;
}
function alertMsg(m){ if (tg && tg.showAlert && tg.isVersionAtLeast("6.2")) tg.showAlert(m); else alert(m); }
function showPhoto(url){ $("viewerImg").src=url; $("viewer").classList.add("show"); updateBack(); }
const thumbsHtml = (list, rmAttr) => list.map((p,i)=>`<div class="thumb"><img src="${esc(photoUrl(p))}" data-view="${esc(photoUrl(p))}" loading="lazy" alt=""><button class="rm" ${rmAttr}="${i}">×</button></div>`).join("");
const photoPicker = () => `<label class="photoBtn" id="photoLbl">📷 Rasm qo'shish<input type="file" accept="image/*" multiple id="fPhoto" hidden></label>`;

function balances(){
  const b = {naqd:0, bank:0, karta:0};
  Object.keys(D.start).forEach(k=>b[accOf(k)]+=D.start[k]||0);
  D.ops.forEach(o=>{
    if (o.kind==="sale") { b.naqd+=o.naqd||0; b.bank+=bankPart(o); b.karta+=o.karta||0; }
    if (o.kind==="exp") b[accOf(o.acc)]-=o.amount;
    if (o.kind==="tr") { b[accOf(o.acc)]-=o.amount; b[accOf(o.to)]+=o.amount; }
  });
  D.sups.forEach(s=>s.pays.forEach(p=>{ if (!p.op) b[accOf(p.acc)]-=p.amount; }));
  D.cust.forEach(c=>{ if (c.type==="pay") b[accOf(c.acc)]+=c.amount; });
  return b;
}
function supInfo(s){
  const paid = sum(s.pays,p=>p.amount), rem = Math.max(0, s.amount-paid);
  const due = addDays(s.date, s.days||0), left = dnum(due)-dnum(today());
  return {paid, rem, due, left};
}
function badge(i){
  if (i.rem<=0) return `<span class="bdg ok">To'langan</span>`;
  if (i.left<0) return `<span class="bdg bad">${-i.left} kun o'tib ketdi</span>`;
  if (i.left===0) return `<span class="bdg bad">Bugun muddat</span>`;
  if (i.left<=3) return `<span class="bdg warn">${i.left} kun qoldi</span>`;
  return `<span class="bdg">${i.left} kun qoldi</span>`;
}
function custList(){
  const m = {};
  D.cust.forEach(c=>{ const k=c.name; m[k]=m[k]||{name:k,bal:0,last:""}; m[k].bal += c.type==="debt"?c.amount:-c.amount; if(c.date>m[k].last) m[k].last=c.date; });
  return Object.values(m).sort((a,b)=>b.bal-a.bal);
}
const names = arr => [...new Set(arr)].sort().map(n=>`<option value="${esc(n)}">`).join("");

/* ================= Saqlash: Telegram bulut + telefon xotirasi ================= */
const CS = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
const CHUNK = 3800, LS = "dokon_v2";
const csGet = keys => new Promise(r => CS.getItems(keys,(e,v)=>r(e?{}:v||{})));
const csSet = (k,v) => new Promise(r => CS.setItem(k,v,()=>r()));
const csDel = keys => new Promise(r => keys.length ? CS.removeItems(keys,()=>r()) : r());
function normalize(d){
  const r = { ops:d.ops||[], sups:d.sups||[], cust:d.cust||[], start:d.start||{}, vendors:d.vendors||[],
              staff:d.staff||[], att:d.att||[], bonus:d.bonus||[], dayx:d.dayx||[], staffInit:!!d.staffInit, schedInit:!!d.schedInit };
  if (!r.staffInit) {
    const m = "2026-10";
    r.staff = [
      {id:uid(), name:"Dilrabo",  salary:3000000, payDay:5,  hasBonus:true,  start:"", phone:"", since:m, active:true},
      {id:uid(), name:"Hayotxon", salary:2500000, payDay:5,  hasBonus:true,  start:"", phone:"", since:m, active:true},
      {id:uid(), name:"Mirjalol", salary:3000000, payDay:15, hasBonus:false, start:"", phone:"", since:m, active:true},
      {id:uid(), name:"Faridun",  salary:3000000, payDay:15, hasBonus:false, start:"", phone:"", since:m, active:true}];
    r.staffInit = true;
  }
  if (!r.schedInit) {
    const S = {dilrabo:["08:00","18:00",0], hayotxon:["08:00","18:00",5], mirjalol:["15:00","23:00",0], faridun:["14:30","23:00",6]};
    r.staff.forEach(st=>{ const x=S[vkey(st.name)]; if (x) { st.start=x[0]; st.end=x[1]; st.dayOff=x[2]; } if (!st.trackFrom) st.trackFrom=today(); });
    r.schedInit = true;
  }
  r.staff.forEach(st=>{ if (!st.trackFrom) st.trackFrom = today(); });
  r.sups.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>ensureVendor(x.sup, x.days, r));
  return r;
}
const vkey = n => String(n||"").trim().toLowerCase();
function findVendor(name, r){ r=r||D; const k=vkey(name); return r.vendors.find(v=>vkey(v.name)===k); }
function ensureVendor(name, days, r){
  r=r||D; if (!vkey(name)) return null;
  let v = findVendor(name, r);
  if (!v) { v = {id:uid(), name:String(name).trim(), phone:"", days: days||15}; r.vendors.push(v); }
  return v;
}
const SUPCAT = "Postavshikka";
const vendorDebt = name => sum(D.sups.filter(x=>vkey(x.sup)===vkey(name)), x=>supInfo(x).rem);
/* Postavshikka to'lov: qarzdan eng eski muddatli yukdan boshlab ayiriladi */
function applyPay(op, targetId){
  let left = op.amount;
  const list = D.sups.filter(x=>vkey(x.sup)===vkey(op.vendor)).map(x=>({s:x,i:supInfo(x)})).filter(x=>x.i.rem>0)
    .sort((a,b)=>((b.s.id===targetId)-(a.s.id===targetId)) || a.i.due.localeCompare(b.i.due) || a.s.date.localeCompare(b.s.date));
  for (const x of list) { if (left<=0) break; const a=Math.min(left, x.i.rem); x.s.pays.push({id:uid(), amount:a, acc:op.acc, date:op.date, op:op.id}); left-=a; }
  return left;
}
function unapplyPay(opId){ D.sups.forEach(x=>x.pays = x.pays.filter(p=>p.op!==opId)); }
function vendorPay(vendor, amount, acc, date, note, targetId){
  const op = {id:uid(), kind:"exp", cat:SUPCAT, vendor, amount, acc, date, note:note||""};
  D.ops.push(op); applyPay(op, targetId); return op;
}

const STAFFCAT = "Oylik";
const MONTHS_GEN = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const mLabel = m => `${MONTHS[+m.slice(5,7)-1]} ${m.slice(0,4)}`;
const nextMonth = m => { const d=new Date(+m.slice(0,4), +m.slice(5,7), 1); return monthKey(d); };
const prevMonth = m => { const d=new Date(+m.slice(0,4), +m.slice(5,7)-2, 1); return monthKey(d); };
const getBonus = (sid,m) => (D.bonus.find(b=>b.staffId===sid&&b.month===m)||{}).amount||0;
function setBonus(sid,m,a){ const b=D.bonus.find(x=>x.staffId===sid&&x.month===m); if(b) b.amount=a; else D.bonus.push({staffId:sid, month:m, amount:a}); }
const staffPays = (sid,m) => D.ops.filter(o=>o.kind==="exp"&&o.staffId===sid&&(!m||o.month===m));
function salaryInfo(st, m){
  const due = nextMonth(m)+"-"+String(st.payDay).padStart(2,"0");
  const total = st.salary + (st.hasBonus ? getBonus(st.id,m) : 0);
  const paid = sum(staffPays(st.id,m), o=>o.amount);
  const rem = total - paid, left = dnum(due) - dnum(today());
  return {due, total, paid, rem, left, bonus:getBonus(st.id,m)};
}
function salaryBadge(i, m){
  if (i.rem<=0) return `<span class="bdg ok">To'langan</span>`;
  if (m >= monthKey(new Date())) return `<span class="bdg">${+i.due.slice(8)}-${MONTHS_GEN[+i.due.slice(5,7)-1]}gacha</span>`;
  if (i.left<0) return `<span class="bdg bad">${-i.left} kun o'tib ketdi</span>`;
  if (i.left<=3) return `<span class="bdg warn">${i.left===0?"Bugun berish kerak":i.left+" kun qoldi"}</span>`;
  return `<span class="bdg">${+i.due.slice(8)}-${MONTHS_GEN[+i.due.slice(5,7)-1]}gacha</span>`;
}
/* oylik muddati yaqin yoki o'tgan (o'tgan oylar bo'yicha) */
function salaryWarnings(){
  const res = [], cm = monthKey(new Date());
  D.staff.filter(st=>st.active!==false).forEach(st=>{
    for (let m=st.since||cm; m<cm; m=nextMonth(m)) { const i=salaryInfo(st,m); if (i.rem>0 && i.left<=3) res.push({st,m,i}); }
  });
  return res.sort((a,b)=>a.i.left-b.i.left);
}
const hm = t => t ? (+t.slice(0,2))*60 + (+t.slice(3,5)) : null;
const nowTime = () => { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const fmtH = mins => `${Math.floor(mins/60)} soat${mins%60?` ${mins%60} daq`:""}`;
const WD = ["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
const wday = s => new Date(Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10))).getUTCDay();
const hasOff = st => st.dayOff!==undefined && st.dayOff!==null && st.dayOff!=="";
const dayEx = (sid,d) => D.dayx.find(x=>x.staffId===sid && x.date===d);
function plannedWork(st, d){ const ex = dayEx(st.id,d); if (ex) return ex.type==="work"; return !hasOff(st) || wday(d)!==+st.dayOff; }
const isLate = (st,a) => st.start && a.in && hm(a.in) > hm(st.start);
const isEarly = (st,a) => st.end && a.out && hm(a.out) < hm(st.end);
function attStats(st, m){
  const xs = D.att.filter(a=>a.staffId===st.id && a.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date));
  let mins=0, late=0, early=0, offWork=0;
  xs.forEach(a=>{ if (a.in && a.out) { let d=hm(a.out)-hm(a.in); if (d<0) d+=1440; mins+=d; }
    if (isLate(st,a)) late++; if (isEarly(st,a)) early++; if (!plannedWork(st,a.date)) offWork++; });
  // reja bo'yicha ish kunlari va kelmagan kunlar (kuzatuv boshlangan kundan bugungacha)
  let planned=0; const absent=[];
  const end = m+"-"+String(new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate()).padStart(2,"0");
  const from = st.trackFrom && st.trackFrom > m+"-01" ? st.trackFrom : m+"-01";
  const to = end < today() ? end : today();
  for (let d=from; d<=to; d=addDays(d,1)) {
    if (!plannedWork(st,d)) continue;
    planned++;
    if (!xs.some(a=>a.date===d) && d<today()) absent.push(d);
  }
  return {days:xs.length, mins, late, early, offWork, planned, absent, list:xs};
}
const schedText = st => `${st.start&&st.end?`${st.start}–${st.end}`:"ish vaqti belgilanmagan"}${hasOff(st)?` · dam: ${WD[+st.dayOff].toLowerCase()}`:""}`;

function vendorStats(){
  const m = {};
  D.vendors.forEach(v=>m[vkey(v.name)]={v, last:"", debt:0, late:0, cnt:0});
  D.sups.forEach(x=>{ const o=m[vkey(x.sup)]; if(!o) return; const i=supInfo(x); o.cnt++; o.debt+=i.rem; if(i.rem>0&&i.left<0) o.late++; if(x.date>o.last) o.last=x.date; });
  return Object.values(m);
}

async function load(){
  if (!ALLOWED) return showLock();
  try { const s=localStorage.getItem(LS); D = normalize(s ? JSON.parse(s) : {}); } catch(e){ D = normalize({}); }
  render();
  if (!CS) return;
  try {
    const n = parseInt((await csGet(["dn"])).dn||"0");
    if (!n) return;
    const keys = Array.from({length:n},(_,i)=>"d"+i);
    const parts = await csGet(keys);
    D = normalize(JSON.parse(keys.map(k=>parts[k]||"").join("")));
    try { localStorage.setItem(LS, JSON.stringify(D)); } catch(e){}
    render();
  } catch(e){}
}
let saving = Promise.resolve();
function save(){
  const s = JSON.stringify(D);
  try { localStorage.setItem(LS, s); } catch(e){}
  if (!CS) return;
  saving = saving.then(async()=>{
    try {
      const old = parseInt((await csGet(["dn"])).dn||"0");
      const chunks = s.match(new RegExp(".{1,"+CHUNK+"}","gs")) || [""];
      for (let i=0;i<chunks.length;i++) await csSet("d"+i, chunks[i]);
      await csSet("dn", String(chunks.length));
      const extra=[]; for (let i=chunks.length;i<old;i++) extra.push("d"+i);
      await csDel(extra);
    } catch(e){}
  });
}

/* ---------- Orqaga qaytish ---------- */
let sheetCur = null, sheetStack = [], tabHist = [], pendingOpener = null;
const sheetOpen = () => $("sheetBg").classList.contains("show");
function openSheet(html){
  F.onChip=null; $("sheet").oninput=null; $("sheet").onchange=null;
  if (pendingOpener) {
    const at = sheetStack.findIndex(x=>x.key===pendingOpener.key);
    if (at>=0) sheetStack = sheetStack.slice(0, at);
    else if (sheetOpen() && sheetCur && sheetCur.key !== pendingOpener.key && !pendingOpener.back) sheetStack.push(sheetCur);
    if (!sheetOpen()) sheetStack = [];
    sheetCur = pendingOpener; pendingOpener = null;
  }
  $("sheet").innerHTML = html; $("sheetBg").classList.add("show"); $("sheet").scrollTop=0; updateBack();
}
function closeSheet(){ $("sheetBg").classList.remove("show"); sheetCur=null; sheetStack=[]; updateBack(); }
function goBack(){
  if ($("viewer").classList.contains("show")) { $("viewer").classList.remove("show"); return updateBack(); }
  if (sheetOpen()) {
    const prev = sheetStack.pop();
    if (prev) { pendingOpener = {...prev, back:true}; prev.fn(...prev.args); }
    else closeSheet();
    return updateBack();
  }
  if (tabHist.length) { tab = tabHist.pop(); window.scrollTo(0,0); render(); }
  updateBack();
}
const canBack = () => $("viewer").classList.contains("show") || sheetOpen() || tabHist.length>0;
function updateBack(){
  const on = canBack();
  const tb = tg && tg.BackButton && tg.isVersionAtLeast && tg.isVersionAtLeast("6.1") ? tg.BackButton : null;
  if (tb) { on ? tb.show() : tb.hide(); }
  else $("backBtn").style.display = on ? "flex" : "none";
}
function goTab(t){ if (t===tab) return; tabHist.push(tab); if (tabHist.length>20) tabHist.shift(); tab=t; window.scrollTo(0,0); render(); updateBack(); }
const field = (l,inner) => `<label>${l}</label>${inner}`;
const numIn = (id,v) => `<input class="num" id="${id}" inputmode="numeric" placeholder="0" value="${v?fmt(v):""}">`;
const dateIn = (id,v) => `<input id="${id}" type="date" value="${v||today()}">`;
const textIn = (id,v,ph,list) => `<input id="${id}" value="${esc(v)}" placeholder="${ph||""}" ${list?`list="${list}"`:""} autocomplete="off">`;
function chips(name, opts, sel){ F[name]=sel; return `<div class="chips" data-chip="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${esc(v)}" class="${v===sel?"on":""}">${l}</button>`).join("")}</div>`; }
const accChips = (name, sel) => chips(name, accs().map(k=>[k,ACC[k]]), accOf(sel));
const actions = del => `<div class="actions"><button class="cancel" id="cancelBtn">Bekor</button><button class="save" id="saveBtn">Saqlash</button></div>${del?`<button class="del" id="delBtn">O'chirish</button>`:""}`;
function bind(onSave, onDel){
  $("cancelBtn").onclick = closeSheet;
  $("saveBtn").onclick = onSave;
  if (onDel && $("delBtn")) $("delBtn").onclick = () => ask("O'chirishni tasdiqlaysizmi?", ()=>{ onDel(); done(); });
}
function ask(msg, yes){
  if (tg && tg.showConfirm && tg.isVersionAtLeast("6.2")) tg.showConfirm(msg, ok=>ok&&yes());
  else if (confirm(msg)) yes();
}
function bad(id){ haptic("error"); const el=$(id); if(el){ el.focus(); el.style.outline="2px solid var(--red)"; setTimeout(()=>el.style.outline="",1200);} }
function done(keepOpen){ haptic("success"); if(!keepOpen) closeSheet(); save(); render(); }

/* --- Savdo --- */
function saleSheet(id, sm){
  const o = id ? D.ops.find(x=>x.id===id) : null;
  const showK = !!(o && o.karta);
  openSheet(`<h2>${o?"Savdoni tahrirlash":"Kassani yopish"}</h2>
    ${field("Kassa", chips("smena", [["1","☀️ "+SMENA[1]],["2","🌙 "+SMENA[2]]], o ? String(o.smena||"") : String(sm||nowSmena())))}
    <div class="lbl" id="smWarn" style="margin-top:6px;color:var(--orange)"></div>
    ${field("Sana", dateIn("fDate", o&&o.date))}
    <label class="step"><i>1</i>Umumiy kunlik savdo</label>
    <input class="num total" id="f_total" inputmode="numeric" placeholder="0" value="${o?fmt(o.total||saleTotal(o)):""}">
    <label class="step"><i>2</i>${SALE.humo}</label>${numIn("f_humo", o&&o.humo)}
    <label class="step"><i>3</i>${SALE.uzcard}</label>${numIn("f_uzcard", o&&o.uzcard)}
    <label class="step"><i>4</i>${SALE.bank}</label>${numIn("f_bank", o&&o.bank)}
    ${showK?field(SALE.karta, numIn("f_karta", o.karta)):""}
    <label class="step"><i>5</i>Kassadan qilingan rasxodlar</label>
    <div id="xRows"></div>
    <button type="button" class="addx" id="xAdd">+ Rasxod qo'shish</button>
    <div class="calc" id="calc"></div>
    ${field("Izoh", textIn("fNote", o?o.note:"", "ixtiyoriy"))}
    ${actions(!!o)}`);
  const vals = () => { const r = {total:num("f_total"), humo:num("f_humo"), uzcard:num("f_uzcard"), bank:num("f_bank"), karta:showK?num("f_karta"):0};
    r.naqd = r.total - bankPart(r) - r.karta; r.exp = sum(X, x=>x.amount); return r; };
  /* kassadan rasxodlar: alohida rasxod yozuvlari, saleId orqali shu savdoga bog'langan */
  let X = o ? D.ops.filter(x=>x.kind==="exp" && x.saleId===o.id).map(x=>({cat:x.cat, amount:x.amount, note:x.note||""})) : [];
  const XCATS = EXP_CATS.filter(c=>c!==STAFFCAT);
  const readX = () => { X = [...$("xRows").querySelectorAll(".xrow")].map(r=>({cat:r.querySelector("select").value, amount:+(r.querySelector(".num").value.replace(/\D/g,""))||0, note:r.querySelector(".xn").value.trim()})); };
  const drawX = () => {
    $("xRows").innerHTML = X.map((x,i)=>`<div class="xrow">
      <select>${(XCATS.includes(x.cat)?XCATS:XCATS.concat([x.cat])).map(c=>`<option ${c===x.cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
      <input class="num" inputmode="numeric" placeholder="summa" value="${x.amount?fmt(x.amount):""}">
      <button type="button" class="x" data-xdel="${i}">×</button>
      <input class="xn" placeholder="izoh (masalan: non, suv)" value="${esc(x.note)}">
    </div>`).join("") || `<div class="lbl" style="margin:2px 0 6px">Bugun kassadan rasxod qilinmagan bo'lsa, bo'sh qoldiring.</div>`;
    $("xRows").querySelectorAll("[data-xdel]").forEach(b=>b.onclick=()=>{ readX(); X.splice(+b.dataset.xdel,1); drawX(); calc(); });
  };
  const calc = () => {
    const v = vals(), neg = v.naqd < 0;
    $("calc").innerHTML = `
      <div class="line"><span>🏦 Umumiy bank hisobiga</span><b>${fmt(bankPart(v))}</b></div>
      <div class="sub">${[["Humo",v.humo],["Uzcard",v.uzcard],["Hisob raqam",v.bank]].map(([l,x])=>`<span style="white-space:nowrap">${l} ${fmt(x)}</span>`).join(" + ")}</div>
      ${showK?`<div class="line"><span>💳 Karta</span><b>${fmt(v.karta)}</b></div>`:""}
      <div class="line ${neg?"red":""}"><span>💵 Naqd savdo</span><b>${(neg?"−":"")+fmt(Math.abs(v.naqd))}</b></div>
      ${v.exp?`<div class="line"><span>💸 Kassadan rasxod</span><b class="red">−${fmt(v.exp)}</b></div>`:""}
      <div class="line cash ${neg||v.naqd-v.exp<0?"red":""}"><span>💵 Kassada qolishi kerak</span><b>${(v.naqd-v.exp<0?"−":"")+fmt(Math.abs(v.naqd-v.exp))}</b></div>
      <div class="sub ${neg?"red":""}">${neg?"Naqdsiz tushum umumiy savdodan ko'p — summalarni tekshiring.":"Naqd savdo avtomatik: umumiy savdo − Humo − Uzcard − Hisob raqam."}</div>`;
  };
  $("sheet").oninput = e => { if (e.target.closest("#xRows")) readX(); calc(); };
  $("sheet").onchange = e => { if (e.target.closest("#xRows")) readX(); };
  $("xAdd").onclick = () => { readX(); X.push({cat:"Ovqat", amount:0, note:""}); drawX(); const r=$("xRows").querySelectorAll(".xrow"); r[r.length-1].querySelector(".num").focus(); };
  drawX(); calc();
  const dup = () => D.ops.find(x=>x.kind==="sale" && x!==o && x.date===($("fDate").value||today()) && String(x.smena||"")===String(F.smena||""));
  const warn = () => { const d=dup(); $("smWarn").textContent = d ? `Bu kassa shu kuni allaqachon kiritilgan (${fmt(saleTotal(d))} so'm). Saqlasangiz, ustiga qo'shiladi.` : ""; };
  F.onChip = n => { if (n==="smena") warn(); };
  $("fDate").addEventListener("change", warn); warn();
  if (!o) setTimeout(()=>{ try { $("f_total").focus(); } catch(e){} }, 250);
  bind(()=>{
    const v = vals();
    if (!v.total) return bad("f_total");
    if (v.naqd < 0) { alertMsg("Humo, Uzcard va hisob raqamga tushgan pul umumiy savdodan ko'p bo'lishi mumkin emas."); return bad("f_total"); }
    readX();
    if (X.some(x=>!x.amount && x.note)) { alertMsg("Rasxod summasini kiriting yoki qatorni o'chiring (×)."); return; }
    const r = {date:$("fDate").value||today(), note:$("fNote").value.trim(), smena: F.smena ? +F.smena : undefined,
               total:v.total, naqd:v.naqd, humo:v.humo, uzcard:v.uzcard, bank:v.bank, karta:v.karta};
    let sale = o;
    if (o) Object.assign(o,r); else { sale = {id:uid(), kind:"sale", ...r}; D.ops.push(sale); }
    D.ops = D.ops.filter(x=>!(x.kind==="exp" && x.saleId===sale.id));
    X.filter(x=>x.amount).forEach(x=>D.ops.push({id:uid(), kind:"exp", cat:x.cat, acc:"naqd", amount:x.amount, date:r.date, note:x.note, saleId:sale.id, smena:r.smena}));
    done();
  }, o && (()=>{ D.ops=D.ops.filter(x=>x!==o && !(x.kind==="exp" && x.saleId===o.id)); }));
}

function expSheet(id){
  const o = id ? D.ops.find(x=>x.id===id) : null;
  openSheet(`<h2>${o?"Rasxodni tahrirlash":"Yangi rasxod"}</h2>
    ${field("Summa", numIn("fAmt", o&&o.amount))}
    ${field("Turi", chips("cat", [[SUPCAT,"🚚 Postavshikka"]].concat(EXP_CATS.map(c=>[c,c])), o?o.cat:"Boshqa"))}
    <div id="expVendBox" style="display:none">
      <label>Qaysi postavshikka</label>
      <input id="evQ" placeholder="qidirish" autocomplete="off">

      <div class="lbl" id="evInfo" style="margin-top:6px"></div>
    </div>
    ${field("Qayerdan to'landi", accChips("acc", o?o.acc:"naqd"))}
    ${field("Sana", dateIn("fDate", o&&o.date))}
    ${field("Izoh", textIn("fNote", o?o.note:"", "masalan: elektr uchun"))}
    ${actions(!!o)}`);
  F.vendor = o && o.cat===SUPCAT ? o.vendor : "";
  const own = name => (o && o.cat===SUPCAT && vkey(o.vendor)===vkey(name)) ? o.amount : 0;
  const drawV = () => {
    const q = vkey($("evQ").value);
    const vs = D.vendors.map(v=>({v, d:vendorDebt(v.name)+own(v.name)}))
      .filter(x=>(!q || vkey(x.v.name).includes(q)) && (x.d>0 || vkey(x.v.name)===vkey(F.vendor)))
      .sort((a,b)=>b.d-a.d);
    $("evChips").innerHTML = vs.map(x=>`<button type="button" data-ev="${esc(x.v.name)}" class="${vkey(x.v.name)===vkey(F.vendor)?"on":""}">${esc(x.v.name)} · ${fmt(x.d)}</button>`).join("")
      || `<span class="lbl">Qarzimiz bor postavshik topilmadi</span>`;
    $("evChips").querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{
      F.vendor = b.dataset.ev; const d = vendorDebt(F.vendor)+own(F.vendor);
      if (!num("fAmt")) $("fAmt").value = fmt(d);
      drawV();
    });
    $("evInfo").textContent = F.vendor ? `Qarzimiz: ${fmt(vendorDebt(F.vendor)+own(F.vendor))} so'm. To'lov shu qarzdan ayiriladi.` : "";
  };
  const toggleV = () => { const on = F.cat===SUPCAT; $("expVendBox").style.display = on?"block":"none"; if (on) drawV(); };
  $("evQ").addEventListener("input", drawV);
  F.onChip = (n)=>{ if (n==="cat") toggleV(); };
  toggleV();
  bind(()=>{
    const amount = num("fAmt"); if (!amount) return bad("fAmt");
    const r = {amount, cat:F.cat, acc:F.acc, date:$("fDate").value||today(), note:$("fNote").value.trim()};
    if (r.cat===SUPCAT) {
      if (!F.vendor) { alertMsg("Postavshikni tanlang"); return; }
      const debt = vendorDebt(F.vendor) + own(F.vendor);
      if (amount > debt) { alertMsg(`${F.vendor}: qarzimiz ${fmt(debt)} so'm. Summa qarzdan ko'p bo'lmasligi kerak.`); return bad("fAmt"); }
      r.vendor = findVendor(F.vendor) ? findVendor(F.vendor).name : F.vendor;
    } else r.vendor = undefined;
    if (o) { unapplyPay(o.id); Object.assign(o, r); if (o.cat===SUPCAT) applyPay(o); }
    else { const op = {id:uid(), kind:"exp", ...r}; D.ops.push(op); if (op.cat===SUPCAT) applyPay(op); }
    done();
  }, o && (()=>{ unapplyPay(o.id); D.ops=D.ops.filter(x=>x!==o); }));
}

    $("thumbs").querySelectorAll("[data-rmp]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [x]=pend.splice(+b.dataset.rmp,1); URL.revokeObjectURL(x.url); drawPend(); });
  };
  $("fPhoto").onchange = e => { [...e.target.files].forEach(f=>pend.push({file:f, url:URL.createObjectURL(f)})); e.target.value=""; drawPend(); };
  $("fPaid").addEventListener("input",()=>$("paidAccBox").style.display = num("fPaid")?"block":"none");
  bind(async()=>{
    const sup = $("fSup").value.trim(); if (!sup) return bad("fSup");
    const amount = num("fAmt"); if (!amount) return bad("fAmt");
    const date = $("fDate").value||today();
    const paid = Math.min(num("fPaid"), amount);
    const btn = $("saveBtn"); if (btn.disabled) return;
    const photos = [];
    if (pend.length) {
      btn.disabled = true;
      try {
        for (let i=0;i<pend.length;i++){ btn.textContent = `Rasm yuklanmoqda ${i+1}/${pend.length}...`; photos.push(await uploadPhoto(pend[i].file)); }
      } catch(e) {
        btn.disabled = false; btn.textContent = "Saqlash";
        return alertMsg("Rasm yuklanmadi. Internetni tekshirib, qayta urinib ko'ring.\n\n" + (e.message||e));
      }
    }
    ensureVendor(sup, num("fDays"));
    const nid = uid(), vname = findVendor(sup).name;
    D.sups.push({id:nid, sup:vname, amount, date, days:num("fDays"), note:$("fNote").value.trim(), photos, pays:[]});
    if (paid) vendorPay(vname, paid, F.acc, date, "", nid);
    pend.forEach(x=>URL.revokeObjectURL(x.url));
    done();
  });
}

function supSheet(id){
  const s = D.sups.find(x=>x.id===id); if (!s) return;
  const i = supInfo(s);
  openSheet(`<h2>${esc(s.sup)}</h2>${badge(i)}
    <div class="box">
      <div class="line"><span>Yuk summasi</span><b>${fmt(s.amount)}</b></div>

      <div class="line"><span>Kelgan sana</span><b>${fd(s.date)}</b></div>
      <div class="line"><span>To'lov muddati</span><b>${fd(i.due)} (${s.days} kun)</b></div>
      ${s.note?`<div class="line"><span>Izoh</span><b>${esc(s.note)}</b></div>`:""}
    </div>
    <h4>Nakladnoy rasmlari</h4>
    <div class="thumbs">${thumbsHtml(s.photos||[], "data-rmph")}</div>
    ${photoPicker()}
    ${s.pays.length?`<h4>To'lovlar</h4><div class="box">${s.pays.map(p=>`<div class="line"><span>${fd(p.date)} · ${accLabel(p.acc)}</span><span><b>${fmt(p.amount)}</b><button class="x" data-payDel="${p.id}">×</button></span></div>`).join("")}</div>`:""}
    ${i.rem>0?`<h4>To'lov qilish</h4>
      ${numIn("pAmt", i.rem)}
      ${field("Qayerdan", accChips("acc","naqd"))}
      ${field("Sana", dateIn("pDate"))}
      <div class="actions"><button class="save" id="payBtn">To'lovni saqlash</button></div>`:""}
    <h4>Ma'lumotni tahrirlash</h4>
    ${field("Postavshik", textIn("fSup", s.sup))}
    ${field("Yuk summasi", numIn("fAmt", s.amount))}
    ${field("Kelgan sana", dateIn("fDate", s.date))}
    ${field("Necha kunga", `<input id="fDays" inputmode="numeric" value="${s.days}">`)}
    ${field("Izoh", textIn("fNote", s.note))}
    ${actions(true)}`);
  $("fPhoto").onchange = async e => {
    const files = [...e.target.files]; e.target.value = ""; if (!files.length) return;
    const lbl = $("photoLbl"), keep = lbl.firstChild.textContent;
    try {
      for (let i=0;i<files.length;i++){ lbl.firstChild.textContent = `Yuklanmoqda ${i+1}/${files.length}...`; const p = await uploadPhoto(files[i]); (s.photos=s.photos||[]).push(p); }
      done(true); supSheet(s.id);
    } catch(err) {
      lbl.firstChild.textContent = keep;
      if ((s.photos||[]).length) { save(); render(); }
      alertMsg("Rasm yuklanmadi. Internetni tekshirib, qayta urinib ko'ring.\n\n" + (err.message||err));
    }
  };
  $("sheet").querySelectorAll("[data-rmph]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); ask("Rasmni o'chirasizmi?",()=>{ s.photos.splice(+b.dataset.rmph,1); done(true); supSheet(s.id); }); });
  if ($("payBtn")) $("payBtn").onclick = ()=>{
    const a = num("pAmt"); if (!a) return bad("pAmt");
    const d = vendorDebt(s.sup);
    if (a > d) { alertMsg(`${s.sup}: umumiy qarzimiz ${fmt(d)} so'm. Summa undan ko'p bo'lmasligi kerak.`); return bad("pAmt"); }
    vendorPay(s.sup, a, F.acc, $("pDate").value||today(), "", s.id);
    done(true); supSheet(s.id);
  };
  $("sheet").querySelectorAll("[data-payDel]").forEach(b=>{
    const p = s.pays.find(x=>x.id===+b.dataset.paydel);
    b.onclick=()=>ask(p.op ? "Bu to'lov rasxodlardan ham butunlay o'chiriladi. Davom etasizmi?" : "To'lovni o'chirasizmi?",()=>{
      if (p.op) { unapplyPay(p.op); D.ops = D.ops.filter(o=>o.id!==p.op); }
      else s.pays = s.pays.filter(x=>x!==p);
      done(true); supSheet(s.id);
    });
  });
  bind(()=>{
    const sup=$("fSup").value.trim(); if(!sup) return bad("fSup");
    const amount=num("fAmt"); if(!amount) return bad("fAmt");
    ensureVendor(sup, num("fDays"));
    Object.assign(s,{sup:findVendor(sup).name, amount, date:$("fDate").value||s.date, days:num("fDays"), note:$("fNote").value.trim()});
    done();
  }, ()=>{
    const ops = [...new Set(s.pays.filter(p=>p.op).map(p=>p.op))];
    D.sups = D.sups.filter(x=>x!==s);
    ops.forEach(id=>{ const op=D.ops.find(o=>o.id===id); if(!op) return; unapplyPay(id); applyPay(op); });
  });
}

/* --- Postavshik (ro'yxat) --- */
function vendSheet(id){

  const items = v ? D.sups.filter(x=>vkey(x.sup)===vkey(v.name)).map(x=>({s:x,i:supInfo(x)})).sort((a,b)=>b.s.date.localeCompare(a.s.date)) : [];
  const debt = sum(items, x=>x.i.rem);
  openSheet(`<h2>${v?esc(v.name):"Yangi postavshik"}</h2>
    ${v&&v.phone?`<a class="callbtn" href="tel:${esc(v.phone.replace(/[^+\d]/g,""))}">📞 ${esc(v.phone)}</a>`:""}
    ${v?`<div class="box">
      <div class="line"><span>Qarzimiz</span><b class="${debt>0?"red":""}">${fmt(debt)} so'm</b></div>
      <div class="line"><span>Jami yuklar</span><b>${items.length} ta · ${fmt(sum(items,x=>x.s.amount))}</b></div>
    </div>
    <div class="actions"><button class="save" id="vNewSup">+ Shu postavshikdan yuk keldi</button></div>
    ${items.length?`<h4>Yuklar</h4><div class="box">${items.map(x=>`<div class="item" data-act="supOpen" data-id="${x.s.id}" style="border-bottom-color:var(--bg)">
      <div class="mid"><div>${fd(x.s.date)} · ${fmt(x.s.amount)}</div>${badge(x.i)}</div>
      <div class="amt">${x.i.rem>0?`<span class="red">${fmt(x.i.rem)}</span>`:""}${(x.s.photos||[]).length?`<small>📎 ${x.s.photos.length}</small>`:""}</div></div>`).join("")}</div>`:""}
    <h4>Ma'lumotlar</h4>`:""}
    ${field("Nomi", textIn("vName", v?v.name:"", "masalan: Coca-Cola"))}
    ${field("Telefon", `<input id="vPhone" type="tel" value="${esc(v?v.phone:"")}" placeholder="+998 ..">`)}
    ${field("Odatda necha kunga qarzga beradi", `<input id="vDays" inputmode="numeric" value="${v?v.days:15}">`)}
    ${actions(!!v && !items.length)}
    ${v&&items.length?`<div class="lbl" style="text-align:center;margin-top:8px">Yuklari bor postavshikni o'chirib bo'lmaydi</div>`:""}`);
  if ($("vNewSup")) $("vNewSup").onclick = ()=>supNewSheet(v.name);
  bind(()=>{
    const name = $("vName").value.trim(); if (!name) return bad("vName");
    const other = findVendor(name); if (other && other!==v) { alertMsg("Bu nomli postavshik ro'yxatda bor"); return bad("vName"); }
    const days = num("vDays")||15, phone = $("vPhone").value.trim();
    if (v) {
      const old = vkey(v.name);
      D.sups.forEach(x=>{ if (vkey(x.sup)===old) x.sup = name; });
      D.ops.forEach(o=>{ if (o.vendor && vkey(o.vendor)===old) o.vendor = name; });
      Object.assign(v, {name, phone, days});
    } else D.vendors.push({id:uid(), name, phone, days});
    done();
  }, v && (()=>{ D.vendors = D.vendors.filter(x=>x!==v); }));
}

function staffPaySheet(sid, opId, m){
  const o = opId ? D.ops.find(x=>x.id===opId) : null;
  const st = D.staff.find(x=>x.id===(o?o.staffId:sid)); if (!st) return;
  const cm = monthKey(new Date());
  const defType = o ? o.ptype : (m && m<cm ? "oylik" : "avans");
  const defMonth = o ? o.month : (m || cm);
  openSheet(`<h2>${esc(st.name)} — ${o?"to'lovni tahrirlash":"pul berish"}</h2>
    ${field("Turi", chips("ptype", [["avans","Avans (oldindan)"],["oylik","Oylik"]], defType))}
    ${field("Qaysi oy oyligidan", `<input id="pMonth" type="month" value="${defMonth}">`)}
    <div class="lbl" id="pInfo" style="margin-top:6px"></div>
    ${field("Summa", numIn("pAmt", o&&o.amount))}
    ${field("Qayerdan berildi", accChips("acc", o?o.acc:"naqd"))}
    ${field("Berilgan sana", dateIn("pDate", o&&o.date))}
    ${field("Izoh", textIn("pNote", o?o.note:"", "ixtiyoriy"))}
    ${actions(!!o)}`);
  const info = () => {
    const mm = $("pMonth").value || defMonth, i = salaryInfo(st, mm);
    const rem = i.rem + (o && o.month===mm ? o.amount : 0);
    $("pInfo").textContent = `${mLabel(mm)}: hisoblangan ${fmt(i.total)}, berilishi kerak ${fmt(Math.max(0,rem))} so'm`;
    return rem;
  };
  $("pMonth").addEventListener("change", info);
  const r0 = info(); if (!o && defType==="oylik" && r0>0) $("pAmt").value = fmt(r0);
  F.onChip = (n,v)=>{ if (n==="ptype" && v==="oylik" && !num("pAmt")) { const r=info(); if (r>0) $("pAmt").value=fmt(r); } };
  bind(()=>{
    const amount = num("pAmt"); if (!amount) return bad("pAmt");
    const month = $("pMonth").value || defMonth;
    const r = {kind:"exp", cat:STAFFCAT, staffId:st.id, ptype:F.ptype, month, amount, acc:F.acc, date:$("pDate").value||today(), note:$("pNote").value.trim()};
    if (o) Object.assign(o, r); else D.ops.push({id:uid(), ...r});
    done(true); staffSheet(st.id, month);
  }, o && (()=>{ D.ops = D.ops.filter(x=>x!==o); }));
}

function exSheet(sid, m){
  const st = D.staff.find(x=>x.id===sid); if (!st) return;

function attSheet(sid, date){
  const st = D.staff.find(x=>x.id===sid); if (!st) return;

  }, a && (()=>{ D.att = D.att.filter(x=>x!==a); }));
}

    ${field("Turi", chips("type", [["debt","➕ Qarzga mol berdik"],["pay","✅ Qarzini to'ladi"]], name&&bal>0?"pay":"debt"))}
    ${field("Summa", numIn("fAmt", name&&bal>0?bal:0))}

    D.cust = D.cust.filter(c=>c.id!==+b.dataset.cdel); done(true);
    D.cust.some(c=>c.name===name) ? custSheet(name) : closeSheet();
  }));
  bind(()=>{
    const nm = name || $("fName").value.trim(); if (!nm) return bad("fName");
    const amount = num("fAmt"); if (!amount) return bad("fAmt");
    const r = {id:uid(), name:nm, type:F.type, amount, date:$("fDate").value||today(), note:$("fNote").value.trim()};
    if (F.type==="pay") r.acc = F.acc;
    D.cust.push(r);
    done(true); custSheet(nm);
  });
}

/* ================= Hodisalar ================= */
document.addEventListener("input", e=>{
  if (e.target.classList.contains("num")) {
    const d = e.target.value.replace(/\D/g,"").slice(0,13);
    e.target.value = d ? fmt(+d) : "";
  }
});
document.addEventListener("click", e=>{
  const chip = e.target.closest("[data-chip] button");
  if (chip) {
    const box = chip.parentElement, n = box.dataset.chip, v = chip.dataset.v;
    box.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===chip));
    F[n] = v; F.onChip && F.onChip(n,v);
    return;
  }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = +el.dataset.id;
  if (a==="tab") { if (el.closest("nav")) { tabHist = el.dataset.t==="home" ? [] : ["home"]; tab = el.dataset.t; window.scrollTo(0,0); render(); updateBack(); } else goTab(el.dataset.t); }
  else if (a==="mnav") { cur.setMonth(cur.getMonth() + +el.dataset.d); render(); }
  else if (a==="saleNew") saleSheet(null, el.dataset.sm);
  else if (a==="saleEdit") saleSheet(id);
  else if (a==="expNew") expSheet();
  else if (a==="expEdit") expSheet(id);
  else if (a==="trNew") trSheet();
  else if (a==="trEdit") trSheet(id);
  else if (a==="startBal") startSheet();
  else if (a==="supNew") supNewSheet();
  else if (a==="supOpen") supSheet(id);
  else if (a==="supF") { supFilter = el.dataset.v; render(); }
  else if (a==="vendNew") vendSheet();
  else if (a==="vendOpen") vendSheet(id);
  else if (a==="custNew") custSheet();
  else if (a==="staffNew") staffSheet();
  else if (a==="staffOpen") staffSheet(id, el.dataset.m);
  else if (a==="staffPayEdit") staffPaySheet(null, id);
  else if (a==="attEdit") attSheet(id, el.dataset.d);
  else if (a==="attIn") { D.att.push({id:uid(), staffId:id, date:today(), in:nowTime(), out:""}); haptic("success"); save(); render(); }
  else if (a==="attOut") { const x=D.att.find(r=>r.staffId===id&&r.date===today()); if (x) { x.out=nowTime(); haptic("success"); save(); render(); } }
  else if (a==="custOpen") custSheet(decodeURIComponent(el.dataset.n));
});
$("sheetBg").addEventListener("click", e=>{
  const v = e.target.closest("[data-view]"); if (v) return showPhoto(v.dataset.view);
  if (e.target.id==="sheetBg") closeSheet();
});
$("viewer").addEventListener("click", ()=>$("viewer").classList.remove("show"));

/* barcha oynalarni "orqaga" tarixiga ulash */
const _wrap = (name, fn) => (...args) => { pendingOpener = {key: name+JSON.stringify(args), fn, args}; return fn(...args); };
["saleSheet","expSheet","trSheet","startSheet","supNewSheet","supSheet","vendSheet","staffSheet","staffPaySheet","exSheet","attSheet","custSheet"]
  .forEach(n => { window[n] = _wrap(n, window[n]); });
if (tg && tg.BackButton) tg.BackButton.onClick(goBack);
$("backBtn").addEventListener("click", goBack);
$("viewer").addEventListener("click", updateBack);

load();
</script>
